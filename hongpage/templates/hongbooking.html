<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hongbooking!</title>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script> -->
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/script.js"></script>
    

    <title>Progress Updates</title>
</head>

<body>
    <main>
        <header>
            <h2>Booking evaluation slots</h2>
        </header>  

        <sector>
            <!-- Hidden input field to hold the password -->
            <input type="hidden" id="passwordInput" value="{{ password }}">
            
            <h2>Password:</h3>
            <!-- Display the password -->
            <p><span id="displayPassword">{{ password }}</span></p>
            
            <!-- Button to copy password -->
            <button id="copyButton" class="copy-password">Copy password</button>

            <br><br><br>

            <h3>Hongbooking download</h3>
            <a href="https://github.com/HONGBAEKIM/hongbooking_public/raw/main/42student.zip" download>Hongbooking file 42 student</a><br><br>
            <a href="https://github.com/HONGBAEKIM/hongbooking_public/raw/main/42piscine.zip" download>Hongbooking file 42 piscine</a>

            <!--<a href="/cgi-bin/download_s.py" class="download-button">Download File for 42 Student </a>
            
                <br><br>
            <a href="/cgi-bin/download_p.py" class="download-button">Download File for 42 Piscine </a> -->




    
        </sector>

        <footer>
            <p>&copy; Hongbooking</p>
        </footer>
        <p>Users online: <span id="usersOnline">0</span></p>


    </main>
    
    <div class="bottom-link" style="text-align: center;">
        <a href="https://youtu.be/FClqKwgo5Bw?si=2FNA79uaEoGimBo3" target="_blank" title="Quick introduction to HTML">
            Quick introduction my 42berlin experience
        </a>
        <a href="/imprint" target="_self" title="Imprint">
            <h3>Imprint</h3>
        </a>
    </div>

    <script>
        // Function to copy password to clipboard
        function copyPassword() {
            // Select the span element containing the password
            var passwordSpan = document.getElementById("displayPassword");
            
            // Create a range object
            var range = document.createRange();
            // Select the text inside the span element
            range.selectNode(passwordSpan);
            // Add the range to the current selection
            window.getSelection().addRange(range);
            
            // Copy the selected text to clipboard
            document.execCommand("copy");
            
            // Clear the selection
            window.getSelection().removeAllRanges();
            
            // Alert the user
            alert("Password copied to clipboard!");
        }

        // Add click event listener to copy button
        document.getElementById("copyButton").addEventListener("click", copyPassword);
    
        // Function to fetch a new password every 30 minutes
        function updatePassword() {
            // Fetch the new password from the server
            fetch('/get_password')
                .then(response => response.json())
                .then(data => {
                    var password = data.password;
                    // Update the displayed password
                    document.getElementById("passwordInput").value = password;
                    document.getElementById("displayPassword").textContent = password;
                })
                .catch(error => console.error('Error fetching password:', error));
        }

        // Call the updatePassword function initially
        updatePassword();

        // Call the updatePassword function every 30 minutes
        setInterval(updatePassword, 30 * 60 * 1000); // 30 minutes in milliseconds

    
    
    
    </script>
</body>
</html>
